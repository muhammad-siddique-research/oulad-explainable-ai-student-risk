name: Research code checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax-compile research modules
        run: python -m compileall -q src scripts tests
      - name: Check software tests on synthetic fixtures
        run: python -m pytest -q
      - name: Validate capacity and calibration audit contracts
        run: python -m unittest discover -s tests -p test_decision_audit.py -v
      - name: Check committed aggregate results for internal consistency
        run: python -m scripts.audit_published_results
      - name: Rebuild aggregate-only manuscript figures
        run: python -m scripts.build_published_figures
      - name: Check research document links
        run: python -m scripts.check_document_links
